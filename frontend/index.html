          imageName: name,
          isQualityChecking: true,
          qualityStatus: 'checking',
          isAnalyzing: false,
          analyzed: false,
          grade: null,
          confidence: null,
          doctorReview: { action: 'Confirm', modifiedGrade: '', notes: '', saved: false }
        });

        setTimeout(() => {
          const isUnclear = name.toLowerCase().includes('unclear') || name.toLowerCase().includes('blur');
          setCurrentScan(prev => ({
            ...prev,
            isQualityChecking: false,
            qualityStatus: isUnclear ? 'unclear' : 'ok'
          }));
        }, 800);
      };

      const runAnalysis = () => {
        if (currentScan.qualityStatus === 'unclear') return;
        setCurrentScan(prev => ({ ...prev, isAnalyzing: true }));

        setTimeout(() => {
          let grade = 'Moderate';
          let conf = 0.912;
          const lower = (currentScan.imageName || '').toLowerCase();
          if (lower.includes('normal') || lower.includes('no dr')) { grade = 'No DR'; conf = 0.982; }
          else if (lower.includes('mild')) { grade = 'Mild'; conf = 0.941; }
          else if (lower.includes('severe')) { grade = 'Severe'; conf = 0.915; }
          else if (lower.includes('proliferative')) { grade = 'Proliferative'; conf = 0.952; }

          setCurrentScan(prev => ({
            ...prev,
            isAnalyzing: false,
            analyzed: true,
            grade: grade,
            confidence: conf,
            doctorReview: { action: 'Confirm', modifiedGrade: grade, notes: '', saved: false }
          }));
        }, 1100);

        setCurrentScan(prev => ({
          ...prev,
          doctorReview: { action, modifiedGrade, notes, saved: true }
        }));
      };

      return (
        <AppContext.Provider value={{
          language, setLanguage, t, isOnline, toggleOnline,
          showReminder, setShowReminder, currentTab, setCurrentTab,
          currentScan, updateScanImage, runAnalysis, saveDoctorReview,

                Explainable AI heatmap visualizer paired with clinician review panel for confirmation or reclassification.
              </p>
            </div>
          </div>
        </div>
      );
    }

    function ScreeningView() {
      return (
        <div style={{ display: 'flex', flexDirection: 'column', gap: '1.5rem' }}>
          <div>
            <h2 style={{ fontSize: '1.6rem', fontWeight: 800, color: '#0f172a' }}>
              👁️ Diabetic Retinopathy Screening Workflow
            </h2>
            <p style={{ fontSize: '0.9rem', color: '#64748b', marginTop: '0.2rem' }}>
              Step-by-step image upload, quality verification, AI severity prediction, Grad-CAM heatmap, and doctor validation.
            </p>
          </div>
          <ImageUpload />
          <QualityCheck />
          <Result />
          <GradCAM />
          <DoctorReview />
        </div>
      );
    }

    function HistoryView() {
      const { historyList, setCurrentTab, t } = useApp();
      const [searchTerm, setSearchTerm] = useState('');
      const [gradeFilter, setGradeFilter] = useState('All');

      const filtered = historyList.filter(item => {
        const matchesSearch = item.patientName.toLowerCase().includes(searchTerm.toLowerCase()) ||
                              item.patientId.toLowerCase().includes(searchTerm.toLowerCase());
        const matchesGrade = gradeFilter === 'All' || item.grade === gradeFilter;
        return matchesSearch && matchesGrade;
      });

      const getSeverityBadgeClass = (g) => {
        switch (g) {
          case 'No DR': return 'severity-nodr';
          case 'Mild': return 'severity-mild';
          case 'Moderate': return 'severity-moderate';
          case 'Severe': return 'severity-severe';
          case 'Proliferative': return 'severity-proliferative';
          default: return 'severity-unclear';
        }
      };

      return (
        <div style={{ display: 'flex', flexDirection: 'column', gap: '1.5rem' }}>
          <div>
            <h2 style={{ fontSize: '1.6rem', fontWeight: 800, color: '#0f172a' }}>
              📋 Patient Screening History Log
            </h2>
            <p style={{ fontSize: '0.9rem', color: '#64748b', marginTop: '0.2rem' }}>
              Comprehensive record of past retina screenings, longitudinal progression trends, and physician validations.
            </p>
          </div>

          <div className="card" style={{ marginBottom: 0, padding: '1rem 1.25rem' }}>
            <div style={{ display: 'flex', gap: '1rem', flexWrap: 'wrap', alignItems: 'center', justifyContent: 'space-between' }}>
              <input 
                type="text" 
                placeholder="🔍 Search by Patient Name or ID..."
                value={searchTerm}
                onChange={(e) => setSearchTerm(e.target.value)}
                style={{ padding: '0.5rem 0.8rem', borderRadius: '8px', border: '1px solid #cbd5e1', flex: 1, minWidth: '220px', fontSize: '0.9rem' }}
              />

              <select
                value={gradeFilter}
                onChange={(e) => setGradeFilter(e.target.value)}
                style={{ padding: '0.5rem 0.75rem', borderRadius: '8px', border: '1px solid #cbd5e1', fontSize: '0.875rem', fontWeight: 600, background: 'white' }}
              >
                <option value="All">All Grades</option>
                <option value="No DR">No DR</option>
                <option value="Mild">Mild</option>
                <option value="Moderate">Moderate</option>
                <option value="Severe">Severe</option>
                <option value="Proliferative">Proliferative</option>
              </select>
            </div>
          </div>

          <div className="card" style={{ padding: 0, overflow: 'hidden' }}>
            <div className="table-responsive">
              <table className="medical-table">
                <thead>
                  <tr>
                    <th>Screening ID</th>
                    <th>{t.patientId} / Name</th>
                    <th>{t.date}</th>
                    <th>{t.grade}</th>
                    <th>Confidence</th>
                    <th>Doctor Status</th>
                    <th>{t.trend}</th>
                    <th>Passport</th>
                  </tr>
                </thead>
                <tbody>
                  {filtered.map((row) => (
                    <tr key={row.id}>
                      <td style={{ fontWeight: 700, color: '#0284c7' }}>{row.id}</td>
                      <td>
                        <div style={{ fontWeight: 700, color: '#0f172a' }}>{row.patientName}</div>
                        <div style={{ fontSize: '0.75rem', color: '#64748b' }}>{row.patientId} • {row.age}y/{row.gender}</div>
                      </td>
                      <td style={{ fontSize: '0.85rem', color: '#475569' }}>{row.date}</td>
                      <td>
                        <span className={`severity-badge ${getSeverityBadgeClass(row.grade)}`}>
                          {row.grade}
                        </span>
                      </td>
                      <td style={{ fontWeight: 600, fontSize: '0.85rem' }}>{row.confidence}</td>
                      <td style={{ fontSize: '0.8rem', color: row.doctorStatus.includes('Pending') ? '#d97706' : '#059669', fontWeight: 600 }}>
                        {row.doctorStatus}
                      </td>
                      <td>
                        <span style={{
                          padding: '0.2rem 0.5rem',
                          borderRadius: '4px',
                          fontSize: '0.8rem',
                          fontWeight: 700,
                          background: row.isHighRisk ? '#fef2f2' : '#f8fafc',
                          color: row.isHighRisk ? '#dc2626' : '#334155',
                          border: row.isHighRisk ? '1px solid #fecaca' : '1px solid #e2e8f0'
                        }}>
                          {row.trend}
                        </span>
                      </td>
                      <td>
                        <button 
                          className="btn btn-secondary" 
                          onClick={() => setCurrentTab('passport')}
                          style={{ padding: '0.3rem 0.6rem', fontSize: '0.8rem' }}
                        >
                          📄 Passport
                        </button>
                      </td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          </div>
        </div>
      );
    }

    function PassportView() {
      const { currentScan, t } = useApp();

      return (
        <div style={{ display: 'flex', flexDirection: 'column', gap: '1.5rem' }}>
          <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', flexWrap: 'wrap', gap: '1rem' }}>
            <div>
              <h2 style={{ fontSize: '1.6rem', fontWeight: 800, color: '#0f172a' }}>
                📄 Diabetic Retinopathy Digital Screening Passport
              </h2>
              <p style={{ fontSize: '0.9rem', color: '#64748b', marginTop: '0.2rem' }}>
                Portable health credential summarizing retinal screening status, severity grade, doctor signatures, and follow-up schedule.
              </p>
            </div>
            <button className="btn btn-secondary" onClick={() => window.print()}>
              🖨️ Print Passport
            </button>
          </div>

          <div className="card" style={{
            background: 'linear-gradient(135deg, #ffffff 0%, #f8fafc 100%)',
            border: '2px solid #0284c7',
            borderRadius: '16px',
            padding: '2rem',
            boxShadow: '0 8px 24px rgba(2, 132, 199, 0.12)'
          }}>
            <div style={{
              display: 'flex',
              justifyContent: 'space-between',
              alignItems: 'center',
              borderBottom: '2px solid #e2e8f0',
              paddingBottom: '1rem',
              marginBottom: '1.5rem',
              flexWrap: 'wrap',
              gap: '1rem'
            }}>
              <div style={{ display: 'flex', alignItems: 'center', gap: '0.75rem' }}>
                <div style={{ background: '#0284c7', padding: '0.6rem', borderRadius: '12px', color: 'white', fontSize: '1.5rem' }}>
                  👁️
                </div>
                <div>
                  <h3 style={{ fontSize: '1.3rem', fontWeight: 800, color: '#0f172a', margin: 0 }}>NEyes Health Passport</h3>
                  <p style={{ fontSize: '0.8rem', color: '#64748b', margin: 0 }}>ID: PASSPORT-DR-892401-2026</p>
                </div>
              </div>
              <span style={{
                background: '#ecfdf5',
                color: '#059669',
                border: '1px solid #a7f3d0',
                padding: '0.4rem 0.9rem',
                borderRadius: '20px',
                fontSize: '0.85rem',
                fontWeight: 700
              }}>
                🛡️ Verified Clinical Record
              </span>
            </div>

            <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(220px, 1fr))', gap: '1.5rem', marginBottom: '1.5rem' }}>
              <div>
                <span style={{ fontSize: '0.75rem', textTransform: 'uppercase', letterSpacing: '0.05em', color: '#64748b', fontWeight: 700 }}>
                  {t.patientName}
                </span>
                <p style={{ fontSize: '1.1rem', fontWeight: 800, color: '#0f172a', margin: '0.2rem 0' }}>Rajesh Kumar</p>
                <p style={{ fontSize: '0.85rem', color: '#475569', margin: 0 }}>ID: DR-892401 | Male, 54 yrs</p>
              </div>

              <div>
                <span style={{ fontSize: '0.75rem', textTransform: 'uppercase', letterSpacing: '0.05em', color: '#64748b', fontWeight: 700 }}>
                  Latest Scan Date
                </span>
                <p style={{ fontSize: '1.1rem', fontWeight: 800, color: '#0f172a', margin: '0.2rem 0' }}>Sep 02, 2026</p>
                <p style={{ fontSize: '0.85rem', color: '#475569', margin: 0 }}>Facility: General Hospital Clinic #4</p>
              </div>

              <div>
                <span style={{ fontSize: '0.75rem', textTransform: 'uppercase', letterSpacing: '0.05em', color: '#64748b', fontWeight: 700 }}>
                  Assessed DR Severity Grade
                </span>
                <div style={{ marginTop: '0.3rem' }}>
                  <span className={`severity-badge severity-${(currentScan.grade || 'Mild').toLowerCase().replace(' ', '')}`} style={{ fontSize: '0.95rem' }}>
                    {currentScan.grade || 'Mild NPDR'}
                  </span>
                </div>
              </div>
            </div>

            <div style={{
              display: 'grid',
              gridTemplateColumns: 'repeat(auto-fit, minmax(280px, 1fr))',
              gap: '1.25rem',
              background: '#ffffff',
              padding: '1.25rem',
              borderRadius: '12px',
              border: '1px solid #e2e8f0'
            }}>
              <div>
                <h4 style={{ fontSize: '0.95rem', fontWeight: 700, color: '#0f172a', marginBottom: '0.5rem' }}>Fundus Scan & Analysis</h4>
                <div style={{ display: 'flex', gap: '1rem', alignItems: 'center' }}>
                  <img 
                    src={currentScan.image} 
                    alt="Retina Scan" 
                    style={{ width: '90px', height: '90px', borderRadius: '8px', objectFit: 'cover', border: '1px solid #cbd5e1' }}
                  />
                  <div style={{ fontSize: '0.85rem', color: '#475569' }}>
                    <p style={{ margin: '0 0 0.3rem 0' }}><strong>Quality:</strong> {currentScan.qualityStatus === 'ok' ? 'Passed ✅' : 'Unclear ❌'}</p>
                    <p style={{ margin: '0 0 0.3rem 0' }}><strong>AI Confidence:</strong> {currentScan.confidence ? (currentScan.confidence * 100).toFixed(1) + '%' : 'N/A'}</p>
                    <p style={{ margin: 0 }}><strong>Clinician Signoff:</strong> Dr. S. Ramanathan</p>
                  </div>
                </div>
              </div>

              <div style={{ display: 'flex', flexDirection: 'column', justifyContent: 'center', background: '#f0f9ff', padding: '1rem', borderRadius: '10px', border: '1px solid #bae6fd' }}>
                <span style={{ fontWeight: 700, fontSize: '0.9rem', color: '#0369a1', marginBottom: '0.4rem' }}>📅 Next Follow-up Recommendation</span>
                <p style={{ fontSize: '0.85rem', color: '#0369a1', margin: 0 }}>
                  Based on current NPDR grade: <strong>Re-screen within 6 months (by Nov 15, 2026)</strong>. Maintain tight HbA1c control.
                </p>
              </div>
            </div>

            <div style={{
              display: 'flex',
              alignItems: 'center',
              justify: 'space-between',
              marginTop: '1.5rem',
              paddingTop: '1rem',
              borderTop: '1px stroke #e2e8f0',
              flexWrap: 'wrap',
              gap: '1rem'
            }}>
              <div style={{ display: 'flex', alignItems: 'center', gap: '0.75rem' }}>
                <div style={{ border: '2px solid #0f172a', padding: '0.4rem', borderRadius: '8px', background: 'white', fontSize: '1.5rem' }}>
                  📱
                </div>
                <div>
                  <p style={{ fontSize: '0.8rem', fontWeight: 700, color: '#0f172a', margin: 0 }}>Digital Security QR Verification</p>
                  <p style={{ fontSize: '0.75rem', color: '#64748b', margin: 0 }}>Scan to verify authenticity on digital health registry</p>
                </div>
              </div>
              <span style={{ fontSize: '0.75rem', color: '#94a3b8' }}>NEyes AI v1.0 • Clinical Protocol Standard</span>
            </div>
          </div>
        </div>
      );
    }

    // --- MAIN APP ---
    function App() {
      const { 
        language, setLanguage, t, isOnline, toggleOnline, 
        showReminder, setShowReminder, currentTab, setCurrentTab 
      } = useApp();

      return (
        <div className="app-container">
          <header className="navbar">
            <div className="nav-brand" onClick={() => setCurrentTab('home')} style={{ cursor: 'pointer' }}>
              <div className="brand-icon">👁️</div>
              <div>
                <div className="brand-title">{t.appTitle}</div>
                <div style={{ fontSize: '0.75rem', opacity: 0.85, fontWeight: 500 }}>{t.appSubtitle}</div>
              </div>
            </div>

            <nav className="nav-links">
              <button className={`nav-link ${currentTab === 'home' ? 'active' : ''}`} onClick={() => setCurrentTab('home')}>
                {t.navHome}
              </button>
              <button className={`nav-link ${currentTab === 'screening' ? 'active' : ''}`} onClick={() => setCurrentTab('screening')}>
                {t.navScreening}
              </button>
              <button className={`nav-link ${currentTab === 'history' ? 'active' : ''}`} onClick={() => setCurrentTab('history')}>
                {t.navHistory}
              </button>
              <button className={`nav-link ${currentTab === 'passport' ? 'active' : ''}`} onClick={() => setCurrentTab('passport')}>
                {t.navPassport}
              </button>
            </nav>

            <div className="nav-controls">
              <select className="lang-select" value={language} onChange={(e) => setLanguage(e.target.value)}>
                <option value="en">English (EN)</option>
                <option value="ta">தமிழ் (TA)</option>
                <option value="hi">हिंदी (HI)</option>
                <option value="te">తెలుగు (TE)</option>
              </select>

              <div className={`offline-badge ${isOnline ? 'online' : 'offline'}`} onClick={toggleOnline}>
                <div className="status-dot"></div>
                <span>{isOnline ? t.online : t.offline}</span>
              </div>
            </div>
          </header>

          {showReminder && (
            <div className="reminder-banner">
              <span>🔔 <strong>Screening Schedule Notice:</strong> {t.reminderMsg}</span>
              <button className="reminder-btn" onClick={() => setShowReminder(false)}>
                ✖ {t.dismiss}
              </button>
            </div>
          )}

          <main className="main-content">
            {currentTab === 'home' && <HomeView />}
            {currentTab === 'screening' && <ScreeningView />}
            {currentTab === 'history' && <HistoryView />}
            {currentTab === 'passport' && <PassportView />}
          </main>

          <footer className="footer">
            <div style={{ fontWeight: 700, color: '#0369a1', marginBottom: '0.2rem' }}>
              👁️ NEyes AI Screening Platform
            </div>
            <p style={{ margin: 0 }}>Designed for preliminary diabetic retinopathy screening & clinical decision support.</p>
          </footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(
      <AppProvider>
        <App />
      </AppProvider>
    );
  </script>
</body>
</html>
